name: Adatfrissítés

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adatok kiolvasása
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scrape.mjs $(grep -E '^[0-9]+' games.txt | tr '\n' ' ') --out=out
      - name: Közzététel (csak ha változott)
        working-directory: out
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nincs változás"; exit 0; fi
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git checkout --orphan tmp
          git add -A
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "adatok $(date -u +%FT%TZ)"
          git push -f origin tmp:data
