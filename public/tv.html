<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>18xx TV</title>
<style>
  :root {
    --bg: #090d14; --panel: #111823; --panel2: #162030; --line: #22303f; --txt: #e9eef5; --mut: #8a98ab;
    --acc: #f2b45a; --good: #3fb950; --blue: #58a6ff; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body.transparent { background: transparent; }
  body.transparent .panel { background: rgba(17, 24, 35, .78); }

  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; padding: 20px; display: grid;
    grid-template-columns: var(--mapw, 1322px) 1fr; grid-template-rows: 50px 1fr 140px; gap: 14px; background:
    radial-gradient(1200px 600px at 15% -10%, rgba(88, 166, 255, .10), transparent 60%), radial-gradient(900px 500px at 100% 110%, rgba(242, 180, 90, .07), transparent 60%); }
  body.transparent #stage { background: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-width: 0; min-height: 0; overflow: hidden; }

  /* fejléc */
  #top { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; padding: 0 4px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hex { width: 46px; height: 46px; flex: none; }
  .brand h1 { margin: 0; font-size: 30px; line-height: 1; letter-spacing: .2px; white-space: nowrap; }
  .brand small { display: block; color: var(--mut); font-size: 15px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  .chips { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0; overflow: hidden; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 15px; color: var(--mut); white-space: nowrap; }
  .chip b { color: var(--txt); font-weight: 650; }
  .chip.warn { border-color: rgba(242, 180, 90, .55); color: var(--acc); background: rgba(242, 180, 90, .08); }
  .chip.step { color: var(--txt); border-color: rgba(88, 166, 255, .5); background: rgba(88, 166, 255, .08); }
  .live { display: flex; align-items: center; gap: 10px; font-size: 17px; white-space: nowrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(63, 185, 80, .6); animation: pulse 2s infinite; flex: none; }
  .dot.upd { background: var(--acc); animation: pulse2 .8s infinite; }
  .dot.off { background: var(--bad); animation: none; }
  .dot.done { background: var(--mut); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(63, 185, 80, 0); } 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); } }
  @keyframes pulse2 { 50% { opacity: .3; } }
  .bankTop { display: flex; gap: 20px; flex: none; }
  .bankTop div { text-align: right; line-height: 1.1; }
  .bankTop small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin-bottom: 3px; white-space: nowrap; }
  .bankTop b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #ipo { position: absolute; left: 30px; bottom: 12px; background: rgba(15, 21, 30, .92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px 8px; font-variant-numeric: tabular-nums; z-index: 3; }
  #ipo:empty { display: none; }
  #ipo h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 700; text-align: center; }
  #ipo .g { display: flex; gap: 14px; }
  #ipo .g div { display: flex; flex-direction: column; font-size: 14px; line-height: 17px; font-weight: 600; text-align: right; }
  #ipo .g div:nth-child(2) { border-left: 1px solid var(--line); padding-left: 12px; }
  #bankBox { padding: 7px 12px 4px; display: flex; flex-direction: column; }
  #bankBox h2 { margin: 0 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
  #intr { font-size: 13px; color: var(--mut); display: flex; flex-direction: column; }
  #intr div.sep { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 3px; }
  #intr div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; line-height: 17px; }
  #intr b { color: var(--txt); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  #trainBox { display: flex; flex-direction: column; }
  #trains { min-height: 0; overflow: hidden; }
  .live small { color: var(--mut); font-size: 14px; display: block; }

  /* térkép */
  #mapPanel { grid-column: 1; grid-row: 2; display: flex; align-items: center; justify-content: center; background: #04070b; position: relative; }
  #mapPanel svg { width: 100%; height: 100%; display: block; }
  #mapPanel .tag { position: absolute; left: 14px; top: 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); z-index: 2; }
  /* az 18xx.games térkép-szabályai */
  svg .tile { fill: none; stroke-width: 1; text-anchor: middle; }
  svg .tile__water { fill: none; stroke: rgb(20, 126, 190); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  svg .tile__text { fill: black; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  svg text.number { font-size: 21px; font-weight: 300; }

  /* jobb oszlop */
  #side { grid-column: 2; grid-row: 2; display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; min-width: 0; }
  #players { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
  .pl { background: var(--panel); border: 1px solid var(--line); border-left: 7px solid var(--pc); border-radius: 14px; padding: 8px 14px 8px 12px; min-width: 0; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 16px; align-items: center; }
  .pl.act { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 26px -4px var(--pc); }
  .pl .nm { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 21px; min-width: 0; }
  .pl .nm span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .rk { color: var(--mut); font-size: 14px; font-weight: 600; }
  .pl .pt { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--mut); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; white-space: nowrap; }
  .pl .pt b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--txt); }
  .pl .pt.run { color: var(--acc); border-color: rgba(242, 180, 90, .6); background: rgba(242, 180, 90, .1); }
  .pl .cash { text-align: right; line-height: 1; }
  .pl .cash small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin-bottom: 3px; }
  .pl .cash b { font-size: 38px; font-weight: 800; color: var(--pc); font-variant-numeric: tabular-nums; }
  .pl .st { display: grid; grid-template-columns: auto auto; gap: 0 12px; line-height: 16px; font-size: 13.5px; color: var(--mut); white-space: nowrap; }
  .pl .st b { color: var(--txt); font-weight: 650; font-variant-numeric: tabular-nums; }
  .pl .hold { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; min-height: 22px; }
  .hold i { display: inline-flex; align-items: center; gap: 3px; font-style: normal; font-size: 12px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 1px 5px 1px 2px; }
  .hold i img { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; }
  .pl .pd { position: absolute; right: 10px; top: -10px; background: var(--acc); color: #1a1205; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .pl .turn { position: absolute; left: 14px; top: -10px; background: var(--pc); color: #0b0f15; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; }
  #corps { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 8px; min-height: 0; }
  .co { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--cc, #666); border-radius: 12px; padding: 5px 10px 4px; display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; overflow: hidden; }
  .co .r1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .co .lg { width: 30px; height: 30px; border-radius: 7px; background: var(--cc, #444); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
  .co .lg img { width: 26px; height: 26px; object-fit: contain; }
  .co .sy { font-weight: 800; font-size: 20px; }
  .co .pr { color: var(--acc); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .co .tr { margin-left: auto; display: flex; gap: 4px; }
  .co .tr b { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; font-size: 14px; font-weight: 700; }
  .co .r2 { font-size: 12.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .co .r2 b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
  .co .r3 { font-size: 12.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
  .co .r3 b { color: var(--txt); font-weight: 600; }
  .co .r3 em { font-style: normal; color: var(--acc); font-weight: 700; }

  #bottom { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; }
  #trainBox { grid-column: 1; grid-row: 1; } #chartBox { grid-column: 2; grid-row: 1; } #bankBox { grid-column: 1; grid-row: 2; } #clockBox { grid-column: 2; grid-row: 2; }
  #chartBox .cv canvas { position: absolute; left: 0; top: 0; }
  #clockBox { padding: 7px 12px 5px; display: flex; flex-direction: column; min-height: 0; }
  #clockBox h2 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 3px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
  #clock { flex: 1; display: flex; flex-direction: column; justify-content: space-around; min-height: 0; }
  .cbtn { display: flex; gap: 6px; }
  .cbtn button { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: none; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; cursor: pointer; line-height: 1.4; }
  .cbtn button:hover { border-color: var(--acc); }
  .cbtn button.go { background: rgba(63, 185, 80, .18); border-color: rgba(63, 185, 80, .6); }
  .cbtn button.stop { background: rgba(242, 180, 90, .16); border-color: rgba(242, 180, 90, .6); color: var(--acc); }
  .pl .pt { display: flex; gap: 6px; margin-left: auto; padding: 0; background: none; border: 0; }
  .pl .pt em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--mut); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
  .pl .pt em b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--txt); }
  .pl .pt.run .tn { color: var(--acc); border-color: rgba(242, 180, 90, .6); background: rgba(242, 180, 90, .1); }
  .pl .pt.run .tn b { color: var(--acc); }
  .pl .pt.run { background: none; border: 0; color: inherit; }
  .pl .nm .ed { cursor: pointer; }
  .pl .nm .ed:hover { text-decoration: underline dotted; }
  .ck em { font-style: normal; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--mut); min-width: 44px; text-align: right; }
  .ck.run em { color: var(--acc); }
  .ck b { min-width: 66px; text-align: right; }
  #clockBox h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .7; margin-left: 4px; }
  #edit { display: none; position: absolute; inset: 0; z-index: 50; background: rgba(5, 8, 12, .72); align-items: center; justify-content: center; }
  #edit.on { display: flex; }
  #edit .ebox { width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
  #edit h3 { margin: 0; font-size: 20px; }
  #edit label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--mut); }
  #edit input#edName { font: inherit; font-size: 20px; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  #edit .sw { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #edit .sw button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  #edit .sw button.sel { border-color: #fff; }
  #edit .sw input { width: 40px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer; }
  #edit .btns { display: flex; gap: 10px; justify-content: flex-end; }
  #edit .btns button { font: inherit; font-size: 15px; font-weight: 700; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  #edit .btns button.go { background: rgba(63, 185, 80, .2); border-color: rgba(63, 185, 80, .6); }  .ck.tot { border-top: 1px solid var(--line); border-radius: 0; margin-top: 1px; padding-top: 2px; }
  .ck.tot i { background: none; }
  .ck.tot span { color: var(--mut); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
  .ck.tot b { color: var(--acc); }
  .ck.off.run { background: none; border-color: var(--line); }
  .ck.off.run i { animation: none; }  .ck { display: flex; align-items: center; gap: 9px; padding: 0 8px; line-height: 1.15; border-radius: 9px; border: 1px solid transparent; min-width: 0; }
  .ck i { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; }
  .ck span { flex: 1; font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ck b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .3px; color: var(--mut); }
  .ck.run { background: color-mix(in srgb, var(--pc) 16%, transparent); border-color: var(--pc); }
  .ck.run b { color: var(--txt); }
  .ck.run i { animation: pulse2 1s infinite; }
  #chartBox { padding: 8px 12px 6px; display: flex; flex-direction: column; }
  #chartBox h2, #trainBox h2, #marketPanel h2 { margin: 0 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
  #chartBox .cv { position: relative; flex: 1; min-height: 0; }
  #trainBox { padding: 8px 12px; }
  #trainBox table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  #trainBox td { padding: 0; line-height: 16.5px; }
  #trainBox td.t { font-weight: 800; width: 44px; }
  #trainBox td.p { color: var(--mut); }
  #trainBox td.n { text-align: right; font-weight: 700; }
  #trainBox tr.z { opacity: .35; }
  #trainBox tr.now td.t { color: var(--acc); }
  #trainBox .pool { margin-top: 4px; font-size: 12px; color: var(--mut); }

  /* tőzsde */
  #marketPanel { grid-column: 1 / 3; grid-row: 3; padding: 6px 12px; position: relative; }
  #marketBox { position: absolute; left: 10px; right: 10px; top: 8px; bottom: 8px; }
  #marketBox .mrow { display: flex; width: 100%; height: 100%; }
  #marketBox .mc { box-sizing: border-box !important; flex: 1 1 0; min-width: 0; height: 100%; padding: 3px 0 !important; border: 1px solid rgba(0,0,0,.25); text-align: center; overflow: hidden; }
  #marketBox .mc > div:first-child { font-size: 13px !important; font-weight: 700; letter-spacing: -.3px; }
  #marketBox .mc img { width: 86% !important; max-width: 36px; height: auto !important; aspect-ratio: 1; margin: 2px auto 0; display: block; }
  #marketPanel .bank { position: absolute; right: 14px; top: 8px; font-size: 13px; color: var(--mut); }
  #marketPanel .bank b { color: var(--txt); }

  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; font-size: 34px; color: var(--mut); padding: 0 200px; z-index: 5; background: var(--bg); }
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <div class="brand">
      <svg class="hex" viewBox="0 0 46 46"><polygon points="23,2 42,12.5 42,33.5 23,44 4,33.5 4,12.5" fill="#f2e35a" stroke="#0a0f16" stroke-width="2"/><text x="23" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a" font-family="Segoe UI, sans-serif">18xx</text></svg>
      <div><h1 id="title">18xx</h1><small id="desc"></small></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="bankTop" id="bankTop"></div>
    <div class="live" id="live"></div>
  </header>

  <section class="panel" id="mapPanel"><div id="mapBox" style="width:100%;height:100%"></div><div id="ipo"></div></section>

  <aside id="side">
    <div id="players"></div>
    
    <div id="bottom">
      <div class="panel" id="chartBox"><h2>Vagyon alakulása a körök során</h2><div class="cv"><canvas id="c2"></canvas></div></div>
      <div class="panel" id="trainBox"><h2>Vonatok</h2><div id="trains"></div></div>
      <div class="panel" id="clockBox"><h2><span>Játékidő <small>kör · össz</small></span><span class="cbtn"><button id="ckGo" type="button"></button><button id="ckReset" type="button" title="Nullázás">↺</button></span></h2><div id="clock"></div></div>
      <div class="panel" id="bankBox"><h2>Bank és hitelek</h2><div id="intr"></div></div>
    </div>
  </aside>

  <section class="panel" id="marketPanel">
    <div class="bank" id="bank"></div>
    <div id="marketBox"></div>
  </section>
  <div id="edit"></div>
  <div id="msg"></div>
</div>

<script src="chart.umd.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const HUB = (q.get("hub") || "https://xx18-live.szilagyijanoswork2.workers.dev").replace(/\/+$/, "");
  const game = (q.get("game") || "").replace(/\D/g, "");
  const LOCAL = q.get("local") === "1";
  if (q.get("bg") === "transparent") document.body.classList.add("transparent");
  const PALETTE = ["#ff7b72", "#58a6ff", "#3fb950", "#d29922", "#bc8cff", "#39c5cf"];
  // játékos-testreszabás (név, szín): az eredeti játékos-névhez kötve, mindenki ugyanazt látja
  const pname = (p) => ((snap && snap.custom && snap.custom[p.name]) || {}).name || p.name;
  const pcolor = (p, i) => ((snap && snap.custom && snap.custom[p.name]) || {}).color || PALETTE[i % PALETTE.length];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => "$" + Math.round(n).toLocaleString("hu-HU").replace(/\u00a0/g, " ");

  // ---------- 1920×1080-as vászon, bármekkora monitorra illesztve ----------
  const stage = $("stage");
  let MAINH = 850, mapAspect = 0;
  function applyMapW() { if (mapAspect) stage.style.setProperty("--mapw", Math.min(Math.round(MAINH * mapAspect) + 4, Math.round(stage.offsetWidth * 0.78)) + "px"); }
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    const W = Math.round(innerWidth / s), H = Math.round(innerHeight / s); // a vászon kitölti a teljes képernyőt, bármilyen az arány
    stage.style.width = W + "px"; stage.style.height = H + "px";
    MAINH = H - 258; applyMapW();
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", fit); fit();

  if (!game) { location.replace("./"); return; }

  let snap = null, view = null, viewRev = 0, state = "connecting", chart = null;

  function showMsg(t) { $("msg").style.display = "flex"; $("msg").textContent = t; }
  function hideMsg() { $("msg").style.display = "none"; }

  const logoUrl = (u) => (view && view.logos && view.logos[u]) || (u ? "https://18xx.games" + u : "");
  const inl = (html) => String(html).replace(/(href|src)="(\/[^"]+\.(?:svg|png|jpe?g|webp|gif))"/g, (m, a, u) => `${a}="${logoUrl(u)}"`);

  // ---------- fejléc ----------
  function renderTop() {
    if (!snap) return;
    $("title").textContent = snap.title || "18xx";
    $("desc").textContent = (snap.description || "").trim();
    document.title = (snap.title || "18xx") + " – TV";
    const chips = [];
    const st = (view && view.status) || "";
    const phase = (/Phase\s+([^\s-]+)/.exec(st) || [])[1];
    const rnd = (/(Operating Round|Stock Round|Auction Round|Draft Round|Initial Stock Round)[^-]*/i.exec(st) || [])[0];
    const step = (st.split(" - ")[2] || "").trim();
    const endNote = (/Game Ends[^]*$/i.exec(st) || [])[0];
    if (phase) chips.push(`<span class="chip">Fázis <b>${esc(phase)}</b></span>`);
    chips.push(`<span class="chip"><b>${esc(rnd ? rnd.trim() : snap.round || "")}</b>${snap.turn ? " · " + snap.turn + ". forduló" : ""}</span>`);
    if (step && !/Final phase/i.test(step)) chips.push(`<span class="chip step">${esc(step)}</span>`);
    if (endNote) chips.push(`<span class="chip warn">⚑ ${esc(endNote)}</span>`);
    $("chips").innerHTML = chips.join("");
    paintLive();
  }

  function paintLive() {
    if (!snap) return;
    const fin = snap.status === "finished";
    const lbl = { live: fin ? "Befejezett játék" : "Élő játék", updating: "Új lépés – frissítés…", offline: "Újracsatlakozás…", error: "Frissítési hiba", connecting: "Csatlakozás…" }[state] || "";
    const cls = state === "updating" ? "upd" : state === "offline" || state === "error" ? "off" : fin ? "done" : "";
    const t = snap.fresh ? new Date(snap.fresh).toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    const last = snap.updatedAt ? new Date(snap.updatedAt * 1000).toLocaleString("hu-HU", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    $("live").innerHTML = `<i class="dot ${cls}"></i><div><b>${lbl}</b><small>frissítve: ${t}${last ? " · utolsó lépés: " + last : ""}</small></div>`;
  }

  // ---------- játékosok ----------
  function renderPlayers() {
    if (!snap) return;
    const ps = snap.players || [];
    const order = ps.map((p, i) => ({ v: p.value, i })).sort((a, b) => b.v - a.v);
    const rank = new Map(order.map((o, r) => [o.i, r + 1]));
    const acting = new Set(snap.acting || []);
    const vp = (view && view.players) || [];
    $("players").style.setProperty("--n", ps.length);
    $("players").innerHTML = ps.map((p, i) => {
      const pc = pcolor(p, i);
      const v = vp.find((x) => x.name === p.name);
      const hold = (v ? v.holdings : []).map((h) => `<i title="${esc(h.sym.replace("*", ""))}"><img src="${logoUrl(h.logo)}" alt="">${esc(h.pct.replace("%", ""))}</i>`).join("");
      return `<div class="pl ${acting.has(p.name) ? "act" : ""}" style="--pc:${pc}">
        ${acting.has(p.name) ? '<span class="turn">LÉP</span>' : ""}${v && v.priority ? '<span class="pd">Priority</span>' : ""}
        <div class="c1"><div class="nm"><span class="ed" data-edit="${esc(p.name)}" title="Kattints: név és szín szerkesztése">${esc(pname(p))}</span><span class="rk">#${rank.get(i)}</span><span class="pt" data-p="${esc(p.name)}"><em class="tn" title="Köridő">⏱ <b>0:00</b></em><em class="tt" title="Összidő">Σ <b>0:00:00</b></em></span></div><div class="hold">${hold}</div></div>
        <div class="cash"><small>Készpénz</small><b>${money(p.cash)}</b></div>
        <div class="st"><span>Érték</span><b>${money(p.value)}</b><span>Likv.</span><b>${money(p.liquidity)}</b><span>Részvény</span><b>${p.shares}</b><span>Cert</span><b>${p.certs}/${snap.certLimit || "?"}</b></div>
      </div>`;    }).join("");
    renderClock();
  }

  // ---------- cégek ----------
  const shareNum = (s) => (String(s).match(/\d+/) || ["0"])[0];
  function renderCorps() {
    if (!view || !view.corps) { $("corps").innerHTML = ""; return; }
    $("corps").innerHTML = view.corps.map((c) => {
      const price = (c.treasury && c.treasury[2]) || (c.market && c.market[2]) || "";
      const pres = (c.holders || []).filter((h) => h.pres)[0];
      const others = (c.holders || []).filter((h) => !h.pres);
      const tr = String(c.trains || "").split(/\s+/).filter(Boolean).map((t) => `<b>${esc(t)}</b>`).join("");
      const holders = [pres ? `<b>${esc(pres.name)}</b> ${shareNum(pres.shares)}` : "", ...others.map((h) => `${esc(h.name)} ${shareNum(h.shares)}`)].filter(Boolean).join(" · ");
      const treas = c.treasury && c.treasury[1] ? ` · kincstár ${esc(c.treasury[1])}` : "";
      return `<div class="co" style="--cc:${esc(c.bg || "#666")}">
        <div class="r1"><span class="lg">${c.logo ? `<img src="${logoUrl(c.logo)}" alt="">` : ""}</span>
          <span class="sy">${esc(c.sym)}</span><span class="pr">${esc(price)}</span><span class="tr">${tr || '<b style="opacity:.4">–</b>'}</span></div>
        <div class="r2">Kassza <b>${esc(c.cash)}</b>${c.lastRun ? ` · utolsó futam <b>${esc(c.lastRun)}</b>` : ""}${c.loans && c.loans !== "0/10" ? ` · hitel <b>${esc(c.loans)}</b>` : ""} · ${c.tokens.length} token</div>
        <div class="r3">${holders}${treas}</div>
      </div>`;
    }).join("");
  }

  // IPO Bid Chart (18USA) – nincs benne az oldal adataiban, a játék szabálylapjáról van átvéve
  const IPO = [[100, 106, 112, 118, 124, 132, 140, 148, 156, 164, 172, 180, 190, 200], [210, 220, 230, 240, 254, 270, 284, 300, 314, 330, 344, 360, 380, 400]];
  function renderIpo() {
    const el = $("ipo");
    if (!snap || !/18\s?USA/i.test(snap.title || "")) { el.innerHTML = ""; return; }
    el.innerHTML = `<h3>IPO Bid Chart</h3><div class="g">${IPO.map((c) => `<div>${c.map((v) => `<span>$${v}</span>`).join("")}</div>`).join("")}</div>`;
  }
  // ---------- vonatok, bank ----------
  function renderTrains() {
    const el = $("trains");
    const t = view && view.info && view.info.trains;
    if (!t) { el.innerHTML = ""; return; }
    const rows = t.rows.map((r) => {
      const rem = (r[2] || "").split("/");
      const left = Number(rem[0]) || 0;
      return `<tr class="${left === 0 && rem.length > 1 && !/∞|inf/.test(r[2]) ? "z" : ""}"><td class="t">${esc(r[0])}</td><td class="p">${esc(r[1])}</td><td class="n">${esc((r[2] || "").replace(/\s/g, ""))}</td></tr>`;
    }).join("");
    el.innerHTML = `<table>${rows}</table>${view.pool ? `<div class="pool">${esc(view.pool)}</div>` : ""}`;
    const bank = (view.bank || []).reduce((o, r) => ((o[r[0]] = r[1]), o), {});
    const B = (k) => esc(bank[k] || "–");
    const row = (l, v, cls) => `<div${cls ? ` class="${cls}"` : ""}><span>${l}</span><b>${v}</b></div>`;
    const ik = Object.keys(bank);
    const ir = ik.find((k) => /repaid/i.test(k)), it = ik.find((k) => /more loans taken/i.test(k));
    $("intr").innerHTML = row("Kamat / hitel", B("Interest per Loan")) + row("Jövőbeli kamat", B("Future Interest per Loan")) + row("Hitelek", B("Loans")) + row("Hitel értéke", B("Loan Value")) + row("El nem indult cég", B("Unstarted corporations"))
      + (ir ? row("Kamat, ha 2 hitelt visszafizetnek", esc(bank[ir]), "sep") : "") + (it ? row("Kamat, ha 4 hitelt felvesznek", esc(bank[it])) : "");
    $("bankTop").innerHTML = "";
    $("bank").innerHTML = "";
  }

  // ---------- térkép és tőzsde ----------
  // A térkép szélén a koordináta-jelölések kétszer szerepelnek (fent+lent, balra+jobbra). Elég egy-egy oldal:
  // az alsó számsort és a jobb oldali betűket levágjuk, és kicsit a szélső (állandó) mezőkbe is belevágunk – így nagyobb lehet a térkép.
  function cropMap(W, H) {
    const s = $("mapBox").querySelector("svg");
    let box = [0, 0, W, H];
    try {
      const ctm = s.getScreenCTM();
      if (ctm && ctm.a) {
        const inv = ctm.inverse(), pt = s.createSVGPoint();
        const at = (el) => { const r = el.getBoundingClientRect(); pt.x = r.left; pt.y = r.top; return pt.matrixTransform(inv); };
        let bottomY = Infinity, rightX = Infinity;
        for (const t of s.querySelectorAll("text")) {
          const tx = t.textContent.trim();
          if (/^\d{1,2}$/.test(tx)) { const p = at(t); if (p.y > H * 0.96) bottomY = Math.min(bottomY, p.y); }
          else if (/^[A-Z]$/.test(tx)) { const p = at(t); if (p.x > W * 0.97) rightX = Math.min(rightX, p.x); }
        }
        const w = isFinite(rightX) ? rightX - 14 : W, h = isFinite(bottomY) ? bottomY - 30 : H;
        box = [0, -2, w, h + 2];
      }
    } catch {}
    s.setAttribute("viewBox", box.join(" "));
    return [box[2], box[3]];
  }  function renderMap() {
    if (!view || !view.map) return;
    const svg = inl(view.map).replace(/<svg id="map"[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"[^>]*>/, (m, w, h) => `<svg id="map" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`);
    $("mapBox").innerHTML = svg;
    const m = view.map.match(/<svg id="map"[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"/);
    if (m) { const [w, h] = cropMap(Number(m[1]), Number(m[2])); mapAspect = w / h; applyMapW(); }
  }
  function renderMarket() {
    if (!view || !view.market) return;
    const box = $("marketBox");
    box.style.transform = "none";
    // a 2D piac egyetlen sorba: a cellákat sorfolytonosan egymás mellé tesszük
    const tmp = document.createElement("div"); tmp.innerHTML = inl(view.market);
    const cells = [...tmp.querySelectorAll("div")].filter((d) => d.style.display === "inline-block" && d.style.position === "relative");
    box.innerHTML = cells.length ? `<div class="mrow">${cells.map((c) => `<div class="mc" style="background-color:${c.style.backgroundColor};color:${c.style.color}">${c.innerHTML}</div>`).join("")}</div>` : inl(view.market);
  }

  // ---------- diagram ----------
  function renderChart() {
    if (!snap) return;
    const ps = snap.players || [], h = snap.history || [];
    Chart.defaults.font.family = '"Segoe UI", system-ui, sans-serif';
    Chart.defaults.font.size = 11;
    Chart.defaults.maintainAspectRatio = false;
    Chart.defaults.animation.duration = 700;
    const datasets = ps.map((p, i) => ({ label: pname(p), data: h.map((x) => x.values[i] ?? null), borderColor: pcolor(p, i), backgroundColor: pcolor(p, i), spanGaps: true, pointRadius: 0, borderWidth: 2.5, tension: 0.3 }));
    if (!chart) {
      chart = new Chart($("c2"), { type: "line", data: { labels: h.map((x) => x.label), datasets },
        options: { interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "top", align: "end", labels: { color: "#e9eef5", boxWidth: 9, boxHeight: 9, padding: 10, usePointStyle: true, font: { size: 12 } } } },
          scales: { x: { ticks: { color: "#8a98ab", maxRotation: 0, autoSkip: true, maxTicksLimit: 9 }, grid: { display: false } }, y: { ticks: { color: "#8a98ab", callback: (v) => money(v) }, grid: { color: "rgba(138,152,171,.15)" }, beginAtZero: true } } } });
    } else { chart.data.labels = h.map((x) => x.label); chart.data.datasets = datasets; chart.update(); }
  }

  // ---------- adatok kezelése ----------
  async function loadView(rev) {
    try {
      const r = await fetch(LOCAL ? `data/${game}.view.json` : `${HUB}/api/game/${game}/view`, { cache: "no-store" });
      if (!r.ok) return;
      view = await r.json();
      viewRev = rev || 1;
      renderAll();
    } catch {}
  }
  // ---------- játékidő-óra ----------
  const CLOCK_CAP = 30 * 60_000;
  const fmtT = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
  const fmtTurn = (ms) => (ms >= 3600000 ? fmtT(ms) : `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`);
  function renderClock() {
    const el = $("clock");
    if (!snap) return;
    const c = snap.clock || { ms: {}, turn: {}, since: Date.now(), acting: [], running: false };
    const running = !!c.running;
    const run = running ? Math.min(Math.max(Date.now() - c.since, 0), CLOCK_CAP) : 0;
    const go = $("ckGo");
    go.textContent = running ? "⏸ Szünet" : "▶ Start";
    go.className = running ? "stop" : "go";
    const ps = snap.players || [];
    const key = ps.map((p, i) => pname(p) + pcolor(p, i) + ((c.acting || []).includes(p.name) ? "*" : "")).join("|") + running;
    if (el.dataset.k !== key) {
      el.dataset.k = key;
      el.innerHTML = ps.map((p, i) => {
        const on = (c.acting || []).includes(p.name);
        return `<div class="ck ${on ? "run" : ""} ${running ? "" : "off"}" style="--pc:${pcolor(p, i)}"><i></i><span>${esc(pname(p))}</span><em></em><b></b></div>`;
      }).join("") + `<div class="ck tot"><i></i><span>Összidő</span><em></em><b></b></div>`;
    }
    const val = (n) => {
      const on = (c.acting || []).includes(n);
      return { tot: (c.ms && c.ms[n] || 0) + (on ? run : 0), turn: ((c.turn && c.turn[n]) || 0) + (on ? run : 0), on };
    };
    let sum = 0;
    [...el.querySelectorAll(".ck:not(.tot)")].forEach((row, i) => {
      const v = val(ps[i].name);
      sum += v.tot;
      row.querySelector("em").textContent = fmtTurn(v.turn);
      row.querySelector("b").textContent = fmtT(v.tot);
    });
    const tb = el.querySelector(".ck.tot b"); if (tb) tb.textContent = fmtT(sum);
    // ugyanez a játékosok kártyáin
    document.querySelectorAll("#players .pt").forEach((x) => {
      const n = x.dataset.p, v = val(n), on = running && v.on;
      x.querySelector(".tn b").textContent = fmtTurn(v.turn);
      x.querySelector(".tt b").textContent = fmtT(v.tot);
      x.classList.toggle("run", on);
    });
  }  // ---------- játékos neve / színe ----------
  const SWATCH = ["#ff7b72", "#f0883e", "#d29922", "#e3b341", "#3fb950", "#39c5cf", "#58a6ff", "#bc8cff", "#f778ba", "#e9eef5"];
  function openEditor(orig) {
    const i = (snap.players || []).findIndex((p) => p.name === orig);
    if (i < 0) return;
    const p = snap.players[i];
    let color = pcolor(p, i);
    const box = $("edit");
    box.innerHTML = `<div class="ebox"><h3>Játékos: ${esc(orig)}</h3>
      <label>Megjelenített név<input id="edName" maxlength="24" value="${esc(pname(p))}"></label>
      <div class="sw">${SWATCH.map((c) => `<button type="button" data-c="${c}" style="background:${c}"></button>`).join("")}<input id="edColor" type="color" value="${color}"></div>
      <div class="btns"><button id="edSave" class="go" type="button">Mentés</button><button id="edReset" type="button">Alaphelyzet</button><button id="edCancel" type="button">Mégse</button></div></div>`;
    box.classList.add("on");
    const mark = () => box.querySelectorAll(".sw button").forEach((b) => b.classList.toggle("sel", b.dataset.c === color));
    mark();
    box.querySelectorAll(".sw button").forEach((b) => b.addEventListener("click", () => { color = b.dataset.c; $("edColor").value = color; mark(); }));
    $("edColor").addEventListener("input", (e) => { color = e.target.value; mark(); });
    const close = () => box.classList.remove("on");
    $("edCancel").addEventListener("click", close);
    box.addEventListener("click", (e) => { if (e.target === box) close(); }, { once: true });
    $("edSave").addEventListener("click", async () => { await customCtl(orig, $("edName").value.trim(), color); close(); });
    $("edReset").addEventListener("click", async () => { await customCtl(orig, "", ""); close(); });
    $("edName").focus(); $("edName").select();
  }
  async function customCtl(player, name, color) {
    try {
      const r = await fetch(LOCAL ? "api/custom" : `${HUB}/api/custom`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: game, player, name, color }) });
      const j = await r.json();
      if (j.custom && snap) { snap.custom = j.custom; renderPlayers(); renderChart(); renderClock(); }
    } catch {}
  }
  $("players").addEventListener("click", (e) => { const t = e.target.closest("[data-edit]"); if (t && snap) openEditor(t.dataset.edit); });
  async function clockCtl(action) {
    try {
      const r = await fetch(LOCAL ? "api/clock" : `${HUB}/api/clock`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: game, action }) });
      const j = await r.json();
      if (j.clock && snap) { snap.clock = j.clock; renderClock(); }
    } catch {}
  }
  $("ckGo").addEventListener("click", () => clockCtl(snap && snap.clock && snap.clock.running ? "pause" : "start"));
  $("ckReset").addEventListener("click", () => { if (confirm("Nullázod az összes játékos óráját?")) clockCtl("reset"); });  setInterval(renderClock, 1000);
  function renderAll() { renderIpo(); renderTop(); renderPlayers(); renderTrains(); renderMap(); renderMarket(); renderChart(); }

  function onSnapshot(d) {
    snap = d; state = "live"; hideMsg();
    if (d.vrev && d.vrev !== viewRev) loadView(d.vrev); else if (!d.vrev && LOCAL && !view) loadView(1);
    renderTop(); renderPlayers(); renderChart(); renderClock();
  }

  let ws = null, retry = 0, timer = null;
  function connect() {
    clearTimeout(timer);
    ws = new WebSocket(HUB.replace(/^http/, "ws") + "/api/ws/" + game);
    ws.onopen = () => { retry = 0; };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "snapshot") onSnapshot(m.data);
      else if (m.type === "status") {
        if (!snap) return showMsg(m.state === "error" ? "Hiba az adatok kiolvasásakor, újrapróbáljuk." : "Az első adatok készülnek… (általában 1–2 perc)");
        state = m.state; paintLive();
      }
    };
    ws.onclose = () => { if (snap) { state = "offline"; paintLive(); } retry = Math.min(retry + 1, 6); timer = setTimeout(connect, 1000 * 2 ** retry); };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 25000);

  async function start() {
    if (LOCAL) {
      const poll = async () => { try { const r = await fetch(`data/${game}.json?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) onSnapshot({ ...(await r.json()), fresh: Date.now() }); } catch {} };
      await poll(); setInterval(poll, 1000); return;
    }
    try {
      const r = await fetch(`${HUB}/api/game/${game}`, { cache: "no-store" });
      if (r.status === 404) return showMsg("Ezt a játékot még nem követjük. Add hozzá a főoldalon.");
      if (r.status === 200) onSnapshot(await r.json()); else showMsg("Az első adatok készülnek… (általában 1–2 perc)");
    } catch { showMsg("Nem érem el a szervert."); }
    connect();
  }
  start();
})();
</script>
</body>
